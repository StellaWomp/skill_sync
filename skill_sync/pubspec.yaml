name: skill_sync
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  image_picker: ^0.8.5+3
  http: ^1.3.0
  permission_handler: ^10.2.0



  cupertino_icons: ^1.0.8

flutter_native_splash:
    color: "#44B8D7"
    image: "imagens/splashscreen.png"
    android: true
    ios: true
    fullscreen: true
    web: false


flutter_icons:
  android: true
  ios: true
  image_path: "imagens/preta.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - imagens/

  fonts:
      - family: PressStart2P
        fonts:
          - asset: fonts/PressStart2P-Regular.ttf

      - family: MarkaziText
        fonts:
          - asset: fonts/MarkaziText-VariableFont_wght.ttf
          - asset: fonts/MarkaziText-Bold.ttf
          - asset: fonts/MarkaziText-Medium.ttf
          - asset: fonts/MarkaziText-Regular.ttf
          - asset: fonts/MarkaziText-SemiBold.ttf

      - family: Homenaje
        fonts:
          - asset: fonts/Homenaje-Regular.ttf